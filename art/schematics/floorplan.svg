<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.15 -5.22 12.75 10.84" width="1275" height="1084" role="img" aria-labelledby="title desc">
  <title id="title">Watch room floor plan</title>
  <desc id="desc">A six-meter round watch room. The seated player faces the CHUD desk and ocean glazing, with the entry window on their left, a braceable floor hatch over a ladder on their right, and a balcony door directly behind them.</desc>
  <style>
    .paper { fill: #f5f6f2; }
    .room { fill: #e8eeeb; }
    .wall { fill: none; stroke: #24383f; stroke-width: .075; stroke-linecap: round; stroke-linejoin: round; }
    .object { fill: #d1dfda; stroke: #334d51; stroke-width: .043; }
    .line { fill: none; stroke: #405b61; stroke-width: .031; stroke-linecap: round; stroke-linejoin: round; }
    .glass { fill: none; stroke: #428287; stroke-width: .12; }
    .rail { fill: none; stroke: #536d73; stroke-width: .04; stroke-linecap: round; }
    .ocean { fill: none; stroke: #75a0ab; stroke-width: .033; stroke-linecap: round; }
    .ram { fill: #a93855; stroke: #fff7f8; stroke-width: .03; }
    .ram-line { fill: none; stroke: #a93855; stroke-width: .026; }
    text { fill: #183036; font-family: system-ui, sans-serif; font-size: .17px; }
    .heading { font-size: .37px; font-weight: 750; }
    .subhead { fill: #466167; font-size: .17px; }
    .label { font-weight: 700; }
    .small { font-size: .15px; }
    .ram-text { fill: #832640; }
  </style>
  <rect class="paper" x="-6.15" y="-5.22" width="12.75" height="10.84"/>
  <text class="heading" x="-5.72" y="-4.57">Watch room floor plan</text>
  <text class="subhead" x="-5.72" y="-4.22">Player faces the ocean · upper watch room · 3.0 m clear height</text>
  <g aria-label="Ocean beyond the front glazing">
    <path class="ocean" d="M-1.55-3.78q.31-.13 .62 0t.62 0t.62 0t.62 0t.62 0 M-1.55-3.59q.31-.13 .62 0t.62 0t.62 0t.62 0t.62 0"/>
    <text class="small" x="0" y="-3.27" text-anchor="middle">Ocean / front</text>
  </g>
  <circle class="room" r="3"/>
  <path class="room" d="M-.94 2.85 H.94 V4.05 H-.94Z"/>
  <path class="wall" d="M-.94 2.849 A3 3 0 1 1 .94 2.849"/>
  <path class="glass" d="M-1.34-2.684 A3 3 0 0 1 1.34-2.684"/>
  <path class="line" d="M-.49-2.9L-.51-3.03 M.49-2.9L.51-3.03"/>
  <path class="glass" d="M-2.974 .394 A3 3 0 0 1 -2.82-1.024"/>
  <path class="line" d="M-2.937-.31L-3.058-.325"/>
  <g aria-label="Curved console and CHUD terminal">
    <path class="object" d="M-1.29-1.92 Q0-2.53 1.29-1.92 L1.10-1.30 Q0-1.77-1.10-1.30Z"/>
    <rect class="object" x="-.56" y="-2.03" width="1.12" height=".23" rx=".045"/>
    <path class="line" d="M-.48-1.86H.48 M-.28-1.63H.28"/>
    <rect class="line" x="-.96" y="-1.82" width=".28" height=".22" rx=".02"/>
  </g>
  <g aria-label="Right floor hatch with ladder below, shown closed">
    <rect x="1.43" y="-1.36" width="1" height=".96" rx=".025" fill="#e9dfc8" stroke="#6d5b39" stroke-width=".05"/>
    <path class="line" stroke-dasharray=".055 .05" opacity=".65" d="M1.65-1.18H2.31 M1.65-.58H2.31 M1.83-1.18V-.58 M2.02-1.18V-.58 M2.21-1.18V-.58"/>
    <path class="line" d="M1.57-1.01H1.66V-.79H1.57Z M2.36-1.17H2.48 M2.36-.61H2.48"/>
  </g>
  <g aria-label="Rear balcony door, deck and rail">
    <path class="wall" d="M-.94 2.85H-.46 M.46 2.85H.94"/>
    <path class="glass" d="M-.46 2.85H.46"/>
    <path class="line" d="M-.46 2.85V2.0 M-.46 2.0 A.85 .85 0 0 1 .39 2.85"/>
    <path class="rail" d="M-.94 2.85V4.05H.94V2.85 M-.94 3.1H-.83V3.94H.83V3.1H.94 M-.94 3.56H-.83 M.94 3.56H.83 M0 3.94V4.05"/>
  </g>
  <g aria-label="Chair and seated player position" transform="translate(0 -1.43)">
    <rect class="object" x="-.29" y=".25" width=".58" height=".6" rx=".105"/>
    <path class="line" d="M-.32 .81Q0 .96 .32 .81"/>
    <circle cx="0" cy=".55" r=".08" fill="#20575a"/>
  </g>
  <g aria-label="Fixture annotations">
    <path class="line" d="M1.12-2.8 L2.02-3.36 H3.22"/>
    <text class="label" x="3.34" y="-3.29">Ocean-view glazing</text>
    <text class="small" x="3.34" y="-3.06">Fixed front backdrop</text>
    <path class="line" d="M.59-1.97 H2.57 L3.17-2.44"/>
    <text class="label" x="3.34" y="-2.39">CHUD terminal</text>
    <path class="line" d="M1.21-1.7 H3.19"/>
    <text class="label" x="3.34" y="-1.65">Curved keeper’s desk</text>
    <path class="line" d="M-3.02-.33 H-3.49"/>
    <text class="label" x="-5.72" y="-.43">Left entry window</text>
    <text class="small" x="-5.72" y="-.18">Opens directly into the watch room</text>
    <path class="line" d="M2.45-.88 H3.33"/>
    <text class="label" x="3.47" y="-.83">Right floor hatch</text>
    <text class="small" x="3.47" y="-.60">1.00 × 0.96 m · ladder below</text>
    <text class="small" x="3.47" y="-.37">Brace the closed lid from this room</text>
    <path class="line" d="M-.24-.66 L-.8-.21 H-1.73"/>
    <text class="label" x="-1.78" y=".03">Chair / player pivot</text>
    <path class="line" d="M.48 2.85 H2.42 L3.2 2.56"/>
    <text class="label" x="3.34" y="2.59">Rear balcony door</text>
    <text class="small" x="3.34" y="2.82">0.92 m clear opening</text>
    <path class="line" d="M.94 3.7H3.2"/>
    <text class="label" x="3.34" y="3.75">Exterior balcony + rail</text>
    <text class="small" x="3.34" y="3.98">1.20 m deck projection</text>
  </g>
  <g aria-label="Watch room inside diameter">
    <path class="line" d="M-3 1.1V4.79 M3 1.12V4.79 M-3 4.62H3 M-3.06 4.68L-2.94 4.56 M2.94 4.68L3.06 4.56"/>
    <text class="small label" x="0" y="4.88" text-anchor="middle">6.0 m internal diameter</text>
  </g>
  <g transform="translate(3.91 5.02)">
    <path class="line" d="M0 0H2 M0-.065V.065 M1-.065V.065 M2-.065V.065"/>
    <text class="small" x="0" y="-.12" text-anchor="middle">0</text>
    <text class="small" x="1" y="-.12" text-anchor="middle">1</text>
    <text class="small" x="2" y="-.12" text-anchor="middle">2 m</text>
  </g>
</svg>
