      <path class="line" d="M-.67-9.43V-10.98 M.67-9.43V-10.98"/>
      <path class="object" d="M-1.63-10.98L0-11.98L1.63-10.98Z"/>
      <ellipse cx="0" cy="-10.2" rx=".33" ry=".23" fill="#c6a263" stroke="#88652c" stroke-width=".04"/>
    </g>
    <g id="seat">
      <path class="line" d="M-.20-6.85V-6.46H.26 M-.13-6.46V-6.05 M.18-6.46V-6.05"/>
      <circle cx="0" cy="-7.2" r=".07" fill="#20575a"/>
    </g>
