<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Window beam lab</title>
    <style>
      :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #0b1014; color: #dce8ec; }
      body { margin: 0; }
      main { max-width: 960px; margin: 0 auto; padding: 28px 18px; }
      h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
      #view { aspect-ratio: 2 / 1; background: #030506; }
      canvas { display: block; width: 100%; height: auto; }
      #controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 20px; margin-top: 20px; }
      #controls[hidden] { display: none; }
      label { display: grid; gap: 5px; }
      .value { float: right; color: #a9c2ce; font-variant-numeric: tabular-nums; }
      input { width: 100%; margin: 0; accent-color: #8cc4dd; }
      select { font: inherit; background: #172229; border: 1px solid #46616f; padding: 4px; border-radius: 3px; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Window beam lab</h1>
      <div id="view"></div>
      <p id="status" role="status">Loading window plates…</p>
      <div id="controls" hidden></div>
    </main>
    <script type="module" src="/src/beam-lab.ts"></script>
  </body>
</html>
