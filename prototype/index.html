<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHUD prototype</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="frame">
      <div id="stage"></div>
      <div id="ui">
        <div id="hud">
          <div id="clock">NIGHT 1 · 12:00 AM</div>
          <div id="power">POWER: NONE</div>
          <div id="chud-status"></div>
        </div>
        <div id="hint" class="hidden"></div>

        <!-- Edge controls: faint static arrows on the stage edges (src/ui/edges.ts). The dwell shows on the cursor ring. -->
        <div id="edges" class="hidden">
          <div class="edge left" data-edge="left"><b>&#9664;</b><span></span></div>
          <div class="edge right" data-edge="right"><b>&#9654;</b><span></span></div>
          <div class="edge bottom" data-edge="bottom"><b>&#9660;</b><span></span></div>
        </div>

        <!-- CHUD's terminal: sits on the desk render's screen (DESK_SCREEN) and follows the camera pan. -->
        <div id="terminal" class="hidden">
          <div id="t-left">
            <div id="t-title">CHUD v0.3</div>
            <div id="t-face"></div>
            <div id="t-band"></div>
            <button id="kill" title="Generator kill switch">GENERATOR <b>ON</b></button>
          </div>
          <div id="t-center">
            <div id="log"></div>
            <div id="question" class="hidden"><span id="question-label">CHUD is waiting for an answer</span><div class="bar"><i id="question-bar"></i></div></div>
            <form id="chat-form" autocomplete="off">
              <input id="chat" maxlength="200" placeholder="Type to CHUD and press Enter" />
            </form>
            <div id="chat-note"></div>
            <div id="quick">
              <button data-quick="ASK_LOCATION">Where is he?</button>
              <button data-quick="POWER_OFF">Power off</button>
            </div>
          </div>
          <div id="t-right">
            <div id="t-clock">12:00</div>
            <!-- Top-down map of the watch room. Entries and lock state only: never Ram. Lights are not here: hold Shift. -->
            <svg id="t-map" viewBox="0 0 100 100" aria-label="Watch room map">
              <circle cx="50" cy="50" r="46" class="wall" />
              <circle cx="50" cy="50" r="11" class="core" />
              <path d="M 28 16 A 40 40 0 0 1 72 16" class="desk" />
              <circle cx="50" cy="13" r="3.2" class="me" />
              <g class="entry" data-entry="WINDOW"><circle cx="7" cy="50" r="6" /><text x="16" y="53">W</text></g>
              <g class="entry" data-entry="HATCH"><circle cx="93" cy="50" r="6" /><text x="78" y="53">H</text></g>
              <g class="entry" data-entry="BALCONY"><rect x="44" y="84" width="12" height="12" /><text x="47" y="80">B</text></g>
            </svg>
            <!-- Lock buttons by the map. CHUD can refuse them (the hijack): then run and brace it yourself. -->
            <div id="locks">
              <button data-quick="LOCK_WINDOW">Lock W</button>
              <button data-quick="LOCK_HATCH">Lock H</button>
              <button data-quick="LOCK_BALCONY">Lock B</button>
            </div>
            <div id="t-power-label">POWER</div>
            <div id="t-power">
              <i data-cell="LOCK_WINDOW">W</i><i data-cell="LOCK_HATCH">H</i><i data-cell="LOCK_BALCONY">B</i><i data-cell="LIGHT">LIGHT</i>
            </div>
          </div>
        </div>

        <!-- Desk artifacts: clickable spots on the desk render (ARTIFACTS in uiConfig.ts), positioned by main.ts. -->
        <div id="artifacts" class="hidden"></div>
        <!-- Reading an artifact: full screen, the night keeps running. Click, right-click or Space puts it down. -->
        <div id="reader" class="hidden"><img id="reader-img" alt="" /><div id="reader-hint">Click, right-click or Space to put it down</div></div>

        <div id="brace-hint" class="hidden"></div>

        <div id="hold-panel" class="hidden">
          <div id="release-hint">Let go to stop bracing</div>
        </div>

        <button id="pause-btn" class="hidden" title="Pause (Esc)">&#10074;&#10074; Pause</button>

        <div id="subtitle"></div>
        <!-- Cursor ring: edge dwell, arms left while bracing, faint dash and rest progress (main.ts renderRing). -->
        <svg id="ring" class="hidden" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15" />
          <circle class="arc" cx="18" cy="18" r="15" pathLength="1" transform="rotate(-90 18 18)" />
        </svg>
        <div id="screen" class="hidden"></div>
        <div id="pause" class="hidden">
          <div class="card">
            <h1>PAUSED</h1>
            <p class="small">The night is frozen. Esc resumes.</p>
            <button id="pause-resume">Resume</button>
            <button id="pause-restart">Restart night</button>
          </div>
        </div>
        <button id="dev-badge" class="hidden" title="Dev mode (click: panel, Backquote or Ctrl+Shift+D: off)">DEV</button>
        <div id="dev" class="hidden"><div id="dev-btns"></div><pre id="dev-text"></pre></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
