<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R.A.M.</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link rel="stylesheet" href="/src/ui/screens.css" />
    <link rel="stylesheet" href="/src/ui/terminal.css" />
  </head>
  <body>
    <div id="loading">
      <progress id="preload" max="1" value="0" aria-label="Loading"></progress>
      <p>Headphones recommended.</p>
    </div>
    <div id="frame">
      <div id="stage"></div>
      <div id="ui">
        <div id="hud" class="hidden">
          <div id="clock"></div>
          <div id="hud-night"></div>
        </div>
        <div id="terminal" class="hidden">
          <div id="t-left">
            <div id="t-face" aria-hidden="true"></div>
          </div>
          <div id="t-center">
            <div id="log"></div>
            <div id="question" hidden aria-hidden="true"></div>
            <form id="chat-form" autocomplete="off">
              <span aria-hidden="true">&gt;</span>
              <input id="chat" maxlength="200" aria-label="Talk to ChudGPT" placeholder=" " />
            </form>
            <div id="quick">
              <button type="button" data-quick="ASK_LOCATION">where is it</button>
              <button type="button" data-quick="POWER_OFF">unlock all</button>
            </div>
          </div>
          <div id="t-right">
            <div id="t-clock"></div>
            <div id="t-map" role="group" aria-label="Watch room locks">
              <svg class="map-room" viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="60" /></svg>
              <button type="button" data-entry="WINDOW" data-quick="LOCK_WINDOW" aria-label="Lock window"><span class="m-key">W</span><svg class="m-lock" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="5.4" width="7.6" height="5.2" rx="1" fill="currentColor" /><path d="M3.8 5.4V3.9a2.2 2.2 0 0 1 4.4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg></button>
              <button type="button" data-entry="HATCH" data-quick="LOCK_HATCH" aria-label="Lock hatch"><span class="m-key">H</span><svg class="m-lock" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="5.4" width="7.6" height="5.2" rx="1" fill="currentColor" /><path d="M3.8 5.4V3.9a2.2 2.2 0 0 1 4.4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg></button>
              <button type="button" data-entry="BALCONY" data-quick="LOCK_BALCONY" aria-label="Lock balcony"><span class="m-key">B</span><svg class="m-lock" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="5.4" width="7.6" height="5.2" rx="1" fill="currentColor" /><path d="M3.8 5.4V3.9a2.2 2.2 0 0 1 4.4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg></button>
            </div>
          </div>
        </div>

        <section id="tutorial" aria-label="Evening practice" hidden>
          <span id="practice-chip" hidden></span>
          <button id="practice-finish" type="button">Skip practice</button>
        </section>
        <div id="subtitle" aria-live="polite"></div>
        <!-- Cursor ring: edge dwell, arms left while bracing, faint dash and rest progress (main.ts renderRing). -->
        <svg id="ring" class="hidden" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15" />
          <circle class="arc" cx="18" cy="18" r="15" pathLength="1" transform="rotate(-90 18 18)" />
        </svg>
      </div>
    </div>
    <div id="screen" class="hidden"></div>
    <div id="pause" class="hidden" role="status">Paused</div>
    <button id="dev-badge" class="hidden" title="Dev mode (click: panel, Backquote or Ctrl+Shift+D: off)">DEV</button>
    <div id="dev" class="hidden"><div id="dev-btns"></div><pre id="dev-text"></pre></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
